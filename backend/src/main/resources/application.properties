quarkus.native.march=x86-64-v2

# Random test port so the suite never collides with whatever else runs on this machine
quarkus.http.test-port=0

# --- Database ---------------------------------------------------------------
# Production reads QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME and
# QUARKUS_DATASOURCE_PASSWORD from the environment. Dev and test start Postgres 17
# through Dev Services.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:17-alpine
# The schema belongs to Flyway in every profile; Hibernate never touches it.
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.datasource.jdbc.max-size=8

# --- Access control ---------------------------------------------------------
# One owner account, created on first start from BECONSCIENT_OWNER_PASSWORD
# (bcrypt in the app_users table). Form authentication with empty
# login/error/landing pages answers 401 instead of redirecting, which suits an SPA.
beconscient.owner=owner
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=
quarkus.http.auth.form.error-page=
quarkus.http.auth.form.landing-page=
quarkus.http.auth.form.post-location=/api/login
quarkus.http.auth.form.cookie-name=beconscient-session
quarkus.http.auth.form.timeout=P14D
quarkus.http.auth.form.new-cookie-interval=PT1H
quarkus.http.auth.form.cookie-max-age=P14D
quarkus.http.auth.form.cookie-same-site=strict
quarkus.http.auth.form.http-only-cookie=true

# Secrets have defaults only in %dev and %test. In production they come from the
# environment, and ProdSecretsGuard refuses to start when one is missing or is a
# known development value.
#   BECONSCIENT_SESSION_KEY        session cookie encryption key, at least 32 characters
#   BECONSCIENT_OWNER_PASSWORD     initial password of the owner account
#   BECONSCIENT_HPKE_KEYS          JSON array of {"kid","private_key"} (base64url X25519)
quarkus.http.auth.session.encryption-key=${beconscient.session-key:}
%dev.beconscient.session-key=dev-only-session-key-0123456789abcdef
%test.beconscient.session-key=dev-only-session-key-0123456789abcdef
%dev.beconscient.owner-password=beconscient-dev
%test.beconscient.owner-password=beconscient-dev
# The test key pair is public on purpose (contract/keys). Production refuses its kid.
%dev.beconscient.hpke.key-files=../contract/keys/test-keypair.json
%test.beconscient.hpke.key-files=classpath:hpke/test-keypair.json

# Ingest authenticates itself through the envelope; health stays open for probes.
quarkus.http.auth.permission.ingest.paths=/ingest/*
quarkus.http.auth.permission.ingest.policy=permit
quarkus.http.auth.permission.health.paths=/q/*
quarkus.http.auth.permission.health.policy=permit
quarkus.http.auth.permission.login.paths=/api/login,/api/session,/api/logout
quarkus.http.auth.permission.login.policy=permit
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated

# Login and pairing share one global limiter. The client address is never used,
# so X-Forwarded-For cannot reset it.
quarkus.http.proxy.proxy-address-forwarding=false
beconscient.rate-limit.free-failures=3
beconscient.rate-limit.base-delay=PT0.5S
beconscient.rate-limit.max-delay=PT30S

# Ingest envelopes are capped at 1 MiB by IngestResource (with a JSON error body);
# this outer limit only protects the server from anything far larger.
quarkus.http.limits.max-body-size=2M
beconscient.ingest.max-body-bytes=1048576
beconscient.ingest.max-events=2000

# --- Derivation -------------------------------------------------------------
beconscient.derivation.every=15s
beconscient.rebuild.every=5s
beconscient.rebuild.blocks-per-step=20
# Tests drive derivation by hand so they stay deterministic.
%test.quarkus.scheduler.enabled=false

# --- Reading ----------------------------------------------------------------
beconscient.fallback-zone=Europe/Lisbon
beconscient.db-budget-bytes=10737418240

# The SPA is served from the same origin in production; this covers `vite dev`.
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=/https?://localhost:[0-9]+/
%dev.quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
%dev.quarkus.http.cors.access-control-allow-credentials=true

# Never log decrypted envelopes or request bodies.
quarkus.log.category."org.beconscient".level=INFO
