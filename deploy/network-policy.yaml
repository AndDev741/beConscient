# Only the page's nginx may reach the backend. Everything else in the cluster
# (including other applications' pods) is refused. The nginx itself stays
# reachable through its NodePort, which is where the TLS proxy connects.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: beconscient
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-from-frontend
  namespace: beconscient
spec:
  podSelector:
    matchLabels: { app: beconscient-backend }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: beconscient-frontend }
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-from-anywhere
  namespace: beconscient
spec:
  podSelector:
    matchLabels: { app: beconscient-frontend }
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8080
