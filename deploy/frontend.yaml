# The page, served by nginx, which also proxies /api/ and /ingest/ to the
# backend. The NodePort is the only exposure on the node; a tunnel or reverse
# proxy terminates TLS in front of it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beconscient-frontend
  namespace: beconscient
spec:
  replicas: 1
  selector:
    matchLabels: { app: beconscient-frontend }
  template:
    metadata:
      labels: { app: beconscient-frontend }
    spec:
      containers:
        - name: nginx
          image: localhost:5000/beconscient-frontend:latest
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 20m, memory: 16Mi }
            limits: { memory: 64Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: beconscient-frontend
  namespace: beconscient
spec:
  type: NodePort
  selector: { app: beconscient-frontend }
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30081
