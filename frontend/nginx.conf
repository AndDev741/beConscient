# Template for the nginx image: at start it is rendered to /etc/nginx/conf.d/default.conf
# with ${BACKEND_UPSTREAM} replaced (only that variable, see NGINX_ENVSUBST_FILTER in the
# Dockerfile; nginx's own $variables are left alone).

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Page API bodies are small JSON; /ingest/ sets its own limit below
    client_max_body_size 256k;

    # Hashed filenames, so they can be cached until the end of time
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The page API lives on the same origin, which is what makes the session cookie work
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_pass http://${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Collector batches: an HPKE envelope passed through byte for byte. The size is
    # capped here, before the backend spends any work on decryption.
    location /ingest/ {
        client_max_body_size 1m;
        proxy_pass http://${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        gzip off;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Single page app: every other path is the app itself, always revalidated
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
