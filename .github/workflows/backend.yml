name: backend
on:
  push:
    branches: [main]
    paths: ["backend/**", "contract/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "contract/**", ".github/workflows/backend.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # Quarkus Dev Services starts Postgres in Docker for the tests.
      - name: Tests
        working-directory: backend
        run: ./mvnw -B test

  # Native image on GHCR, like befree's. be-infra's Flux image automation picks
  # up each new :latest digest and deploys it.
  image:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/anddev741/beconscient-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # Runs in Quarkus's builder container; march=x86-64-v2 comes from
      # application.properties (the server has no AVX2).
      - name: Native build
        working-directory: backend
        run: ./mvnw -B package -DskipTests -Dnative -Dquarkus.native.container-build=true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        working-directory: backend
        run: |
          docker build -f src/main/docker/Dockerfile.native-micro \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t "$IMAGE:${GITHUB_SHA::7}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
